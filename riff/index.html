<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Riffs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf8f5;
    --card-bg: #ffffff;
    --stroke: #ecead0;
    --text-strong: #1a1a1a;
    --text: #4a4a4a;
    --text-weak: #8a8a85;
    --accent: #f04d23;
    --shadow: 0 1px 2px rgba(0,0,0,0.04), 0 4px 12px rgba(0,0,0,0.04);
    --shadow-hover: 0 2px 4px rgba(0,0,0,0.06), 0 12px 28px rgba(0,0,0,0.08);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Commissioner', system-ui, -apple-system, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .page {
    max-width: 1240px;
    margin: 0 auto;
    padding: 56px 32px 96px;
  }
  .header {
    margin-bottom: 40px;
  }
  .eyebrow {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 8px;
  }
  h1 {
    font-size: 32px;
    font-weight: 700;
    color: var(--text-strong);
    margin: 0 0 8px;
    letter-spacing: -0.02em;
  }
  .subtitle {
    font-size: 15px;
    color: var(--text-weak);
    margin: 0;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 20px;
  }
  .board-card {
    display: block;
    background: var(--card-bg);
    border: 1px solid var(--stroke);
    border-radius: 12px;
    overflow: hidden;
    text-decoration: none;
    color: inherit;
    box-shadow: var(--shadow);
    transition: transform 200ms cubic-bezier(.2,.7,.2,1), box-shadow 200ms cubic-bezier(.2,.7,.2,1);
  }
  .board-card:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-hover);
  }
  .board-thumb {
    aspect-ratio: 16 / 10;
    background: #f4f2ec;
    overflow: hidden;
    position: relative;
    border-bottom: 1px solid var(--stroke);
  }
  .board-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top center;
    display: block;
  }
  .board-thumb-empty {
    width: 100%;
    height: 100%;
    display: grid;
    place-items: center;
    color: var(--text-weak);
    font-size: 13px;
  }
  .board-body {
    padding: 16px 18px 18px;
  }
  .board-title {
    font-size: 16px;
    font-weight: 600;
    color: var(--text-strong);
    letter-spacing: -0.01em;
    margin-bottom: 6px;
    word-break: break-word;
  }
  .board-meta {
    font-size: 12px;
    color: var(--text-weak);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .board-meta .dot {
    opacity: 0.5;
  }
  .board-teaser {
    margin-top: 10px;
    font-size: 13px;
    color: var(--text);
    line-height: 1.45;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .empty-state {
    padding: 48px 32px;
    border: 1px dashed var(--stroke);
    border-radius: 12px;
    background: var(--card-bg);
    text-align: center;
  }
  .empty-title {
    font-size: 16px;
    font-weight: 600;
    color: var(--text-strong);
    margin-bottom: 8px;
  }
  .empty-body {
    font-size: 13px;
    color: var(--text-weak);
    line-height: 1.6;
  }
  code, pre {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  code {
    background: var(--bg);
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 12px;
    color: var(--text-strong);
  }
  pre {
    background: var(--bg);
    padding: 12px 14px;
    border-radius: 8px;
    margin: 12px auto 0;
    display: inline-block;
    text-align: left;
    font-size: 12px;
    color: var(--text-strong);
  }
</style>
</head>
<body>
  <div class="page">
    <div class="header">
      <div class="eyebrow">Riffs</div>
      <h1>No boards yet</h1>
      <p class="subtitle">Divergent design exploration — pick a board to open its compare view.</p>
    </div>
    
    <div class="empty-state">
      <div class="empty-title">No riffs yet</div>
      <div class="empty-body">
        Create a folder here (e.g. <code>homepage-exploration/</code>), drop in
        <code>variant-a-*.html</code> through <code>variant-f-*.html</code> plus
        a <code>compare.html</code>, then run:
        <pre>node capture.js homepage-exploration</pre>
      </div>
    </div>
  </div>
</body>
</html>
